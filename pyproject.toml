[project]
name = "dip-fraktionen"
version = "0.1.0"
description = "MCP-Server und Auswertung der Fraktionszugehörigkeit im Deutschen Bundestag auf Basis der DIP-API"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.1.*",
    "httpx>=0.27",
    "openai>=1.40",
]

[project.scripts]
dip-fraktionen = "dip_fraktionen.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dip_fraktionen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
